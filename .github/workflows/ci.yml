name: CI

# 默认测试不触网，所以这里只跑离线的那一套。
# live 测试由 HARNESS_COMPAT_LIVE=1 显式开启，需要真实网关，CI 里不跑。
on:
  pull_request:
  push:
    branches: [main]

# 同一个分支的旧运行自动取消：PR 连续推送时不必为每个中间态排队。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  offline:
    name: typecheck + build + test (offline)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install root dependencies
        run: npm ci

      # 桌面宿主测试把仓库根的 dist/ 与 dist-mcp/ 当作「内核已编译」的证据：
      # 缺了它们，宿主里的技能/语料/探针用例会整组 skip（见
      # tests/desktop/host.test.js 的 DIST_BUILT 系列常量）。先构建，跳过就
      # 会变成静默的覆盖下降。
      - name: Build kernel and domain MCP servers
        run: npm run build && npm run build:mcp

      - name: Typecheck
        run: npm run typecheck

      # `tsconfig.json` 只 include src/tests/mcp-servers，而 `allowJs` 未开启——
      # desktop/renderer/app.js 与 settings.js 因此不在 tsc 里，也没有测试导入
      # 它们。实测：往 app.js 塞一段语法错误，npm test 仍然全绿。这一步用
      # `node --check` 扫 desktop/ 与 scripts/ 下每个 JS 文件补上这个盲区。
      - name: Syntax check JS (desktop / scripts)
        run: npm run check:js

      # npm test 不触网；语料与查询集是本地资产（不入库），相关回归组会自动
      # skip，这是设计好的行为，不是失败。
      - name: Test (offline)
        run: npm test

      # vitest.config.ts 里设了 lines 85% 阈值，但它只在 --coverage 下生效，
      # 而 `npm test` 不生成覆盖率——不单独跑这一步，那道闸门等于不存在。
      - name: Coverage gate (lines ≥ 85%)
        run: npm run coverage

  # lint 目前等同 tsc --noEmit（D-006），所以没有独立 job —— 跑两遍不会
  # 多提供任何信息。等 D-006 关闭、接上真正的静态检查后再加。
