    reason: "M4 LLM 端点未提供"
  C:
    enabled: false
    reason: "M3 kb-mcp 算法未提供，忠实复现待实现"
  C_prime:
    enabled: false
    reason: "切分与分词网格待 dev 调参实现"
  D:
