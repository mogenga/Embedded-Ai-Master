corpus_dir: corpus/kb
data_dir: data
results_dir: results

# T11：导航文件可为方案内部读取，但任何方案都不得把它们作为候选输出。
# _inbox.md 是 kb_contribute 收件箱（38 条未审阅条目），cases/_about.md 是使用说明；
# 二者与 _sources.md 一样不属于可检索语料，统一列入导航清单。
navigation_files:
  - index.yaml
  - _vendor-index.md
  - _sources.md
  - _inbox.md
  - _about.md

