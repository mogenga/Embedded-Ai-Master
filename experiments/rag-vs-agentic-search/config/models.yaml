# 预注册模型候选（spec §6.3 / T4）。
# 选择规则写死：dev Recall@2 最高；差距 < 2pp 时优先本地/低成本。
# 端点与密钥不写入本文件；运行时由环境变量注入。

llm:
  candidates:
    - id: local-flash
      kind: openai_compatible
      model: null          # 待用户提供模型名（M4）
      base_url_env: RAGLAB_LLM_BASE_URL
      model_env: RAGLAB_LLM_MODEL
      temperature: 0.0
      repeat: 3            # 网关不支持 seed 时按 §6.4 重复 3 次

embedding:
  candidates:
    - id: local-bge-m3
      kind: local
      model: BAAI/bge-m3
      requires: local-embed
    - id: api-embed-1
      kind: openai_compatible
      model: null          # 待用户提供（M4）
      base_url_env: RAGLAB_EMBED_BASE_URL
      model_env: RAGLAB_EMBED_MODEL
