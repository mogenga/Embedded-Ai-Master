# 方案 B：Agentic search（spec §8.3）。
# 工具面固定为 glob / grep / read / submit；提示词全文入预注册（T10）。

scheme: B
prompt_path: prompts/agentic_system.txt
params:
  # 预注册网格（§6.3）：{6, 12, 20}，取 dev 首次达到最高值 -1pp 的最小轮数。
  max_tool_rounds: [6, 12, 20]
  max_candidates: 5
  read_max_lines: 2000
  read_max_bytes: 262144
  grep_max_results: 100
  temperature: 0.0
  repeat: 3
  tools: [glob, grep, read, submit]
