<!doctype html>
<html lang="zh-CN" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Embedded-Ai-Master · 症状驱动固件调试 Agent</title>
<script>
(function () {
  var theme = "system";
  try {
    var stored = localStorage.getItem("eam-theme");
    if (stored === "light" || stored === "system" || stored === "dark") theme = stored;
  } catch (e) {
    theme = "system";
  }
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/ui/main.tsx"></script>
</body>
</html>
